# Synology Container Manager: Project -> Create -> use this compose file.
# Downloads land in /data, which we map to the big Media share (TBs free).
# Put DISCORD_WEBHOOK in a .env next to this file, or in the Container Manager env UI.
services:
  d2r-scraper:
    build: .
    image: d2r-cdn-scraper:latest
    container_name: d2r-scraper
    restart: unless-stopped
    environment:
      - INTERVAL=60          # poll every product every 60s
      - DATA=1               # full data download on any new plaintext build
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK:-}
      - TZ=Europe/Amsterdam
    volumes:
      # left = a folder on the big Media share; adjust the share name if yours
      # differs (Synology shares live under /volume1/<ShareName>). Everything the
      # scraper downloads goes here - the TB volume, not the system volume.
      - /volume1/Media/d2r-cdn:/data
